services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: order_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/order_db
      CAPASHINO_INTERNAL_URL: https://capashino.dev-2.python-labs.ru
      CAPASHINO_API_TOKEN: ${CAPASHINO_API_TOKEN:-your-local-token}
      DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy

  # Фоновые компоненты (outbox relay + Kafka consumer) — отдельный процесс,
  # как требует ТЗ (запуск из bin/, не фоновой корутиной в API).
  worker:
    build: .
    command: ["bash", "./run-worker.sh"]
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/order_db
      CAPASHINO_INTERNAL_URL: https://capashino.dev-2.python-labs.ru
      CAPASHINO_API_TOKEN: ${CAPASHINO_API_TOKEN:-your-local-token}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka.kafka.svc.cluster.local:9092}
      DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
