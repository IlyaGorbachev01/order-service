[project]
name = "order-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ilya Gorbachev", email = "ilya-gorbachev01@yandex.ru" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.148.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "sqlalchemy[asyncio]>=2.1.5",
]

[dependency-groups]
dev = [
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 88  # Значение по умолчанию для ruff, но отличается от PEP8
target-version = "py313"

extend-exclude = [
    "alembic/versions",  # Автогенерируемые миграции
]

[tool.ruff.lint]
select = [
    "ANN",      # flake8-annotations
    "ARG",      # flake8-unused-arguments
    "ASYNC",    # flake8-async
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "COM",      # flake8-commas
    "D",        # pydocstyle
    "E",        # pycodestyle
    "F",        # pyflakes
    "G",        # flake8-logging-format
    "I",        # isort
    "N",        # pep8-naming
    "PIE",      # flake8-pie
    "PLC0415",  # import-outside-top-level
    "PT",       # flake8-pytest-style
    "Q",        # flake8-quotes
    "RET",      # flake8-return
    "RUF",      # Ruff
    "SIM",      # flake8-simplify
    "TC",       # flake8-type-checking
    "UP",       # pyupgrade
    "W",        # pycodestyle (warnings)
]

ignore = [
    "ANN204",   # Missing return type annotation for special method
    "ANN401",   # Dynamically typed expressions (typing.Any)
    "COM812",   # Checks for the absence of trailing commas
    "D100",     # Missing docstring in public module
    "D104",     # Missing docstring in public package
    "D107",     # Missing docstring in `__init__`
    "RUF001",   # Checks for ambiguous Unicode characters in strings
    "RUF002",   # Checks for ambiguous Unicode characters in docstrings
    "RUF003",   # Checks for ambiguous Unicode characters in comments
    "SIM108",   # Use ternary operator
]

unfixable = [
    "F841",   # Не удалять автоматически неиспользуемые переменные
    "ERA001", # Не удалять закомментированный код автоматически
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
